<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻编辑器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background: #f5f7fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        header { background: linear-gradient(135deg, #0c2461, #1e3799); color: white; padding: 25px 30px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .top-controls { display: flex; gap: 15px; padding: 15px 25px; background: #f8f9fa; border-bottom: 1px solid #eaeaea; }
        .top-btn { padding: 12px 18px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .editor-container { display: flex; min-height: 700px; }
        .file-list-panel { width: 280px; padding: 25px; border-right: 1px solid #eaeaea; overflow-y: auto; }
        .news-item { padding: 15px; margin-bottom: 10px; background: white; border-radius: 8px; cursor: pointer; }
        .news-item.selected { border: 2px solid #2ecc71; background: #e8f8f0; }
        .editor-panel, .preview-panel { flex: 1; padding: 25px; overflow-y: auto; }
        .form-group { margin-bottom: 25px; padding: 20px; background: white; border-radius: 10px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .content-block { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; border: 1px solid #eaeaea; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }
        .btn-add { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .preview-image img { max-width: 100%; max-height: 200px; }
        .notification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: #2ecc71; color: white; border-radius: 8px; transition: top 0.4s; z-index: 1000; }
        .notification.show { top: 30px; }
        .notification.error { background: #e74c3c; }
        .preview-section { margin-bottom: 30px; }
        .preview-text, .preview-strong { padding: 15px; line-height: 1.8; }
        .preview-strong { font-weight: bold; }
        .image-error { color: #e74c3c; text-align: center; padding: 10px; }
        .content-type-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .type-btn { flex: 1; padding: 10px; background: #ecf0f1; border: none; border-radius: 6px; cursor: pointer; text-align: center; }
        .type-btn.active { background: #3498db; color: white; }
        .preview-cover { margin-top: 15px; border: 1px dashed #ddd; padding: 15px; text-align: center; }
        .preview-cover img { max-width: 100%; max-height: 200px; }
        .empty-cover { color: #7f8c8d; text-align: center; padding: 30px; border: 1px dashed #ddd; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="notification" :class="{'show': showNotification, 'error': notificationType === 'error'}">
            <i :class="notificationIcon"></i> {{ notificationMessage }}
        </div>

        <div class="container">
            <header>
                <h1><i class="fas fa-newspaper"></i> 新闻编辑器</h1>
            </header>

            <div class="top-controls">
                <button class="top-btn" @click="saveNewsConfig"><i class="fas fa-save"></i> 保存</button>
                <button class="top-btn" @click="createNewNews"><i class="fas fa-plus"></i> 新建</button>
            </div>

            <div class="editor-container">
                <div class="file-list-panel">
                    <h3>新闻列表</h3>
                    <div v-for="news in localNewsList" :key="news.id" class="news-item" 
                         :class="{'selected': config.id === news.id}" @click="selectNews(news)">
                        {{ news.title }}
                    </div>
                </div>

                <div class="editor-panel">
                    <h2>编辑配置</h2>
                    
                    <div class="form-group">
                        <h3><i class="fas fa-info-circle"></i> 基本信息</h3>
                        <label>ID</label>
                        <input v-model="config.id" readonly>
                        <label>标题</label>
                        <input v-model="config.title">
                        <label>分类</label>
                        <select v-model="config.categorylabel">
                            <option value="#Mint 进行时">Mint 进行时</option>
                            <option value="#MiNT 智造力">MiNT 智造力</option>
                        </select>
                        <label>发布时间</label>
                        <input v-model="config.time">
                    </div>

                    <div class="form-group">
                        <h3><i class="fas fa-image"></i> 封面设置</h3>
                        <label>封面图片URL</label>
                        <input type="text" v-model="config.pic" placeholder="例如: assets/News/test.jpg">
                        <div class="preview-image" v-if="config.pic">
                            <img :src="getResourcePath(config.pic)" @error="handleImageError">
                            <div v-if="imageError[getResourcePath(config.pic)]" class="image-error">
                                <i class="fas fa-image"></i> 封面图加载失败
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <h3><i class="fas fa-photo-film"></i> 头部图片</h3>
                        <div v-for="(img, index) in config.sections[0].headPic" :key="'head'+index" class="content-block">
                            <button class="remove-btn" @click="removeHeadPic(index)">×</button>
                            <label>图片URL {{index + 1}}</label>
                            <input type="text" v-model="config.sections[0].headPic[index]">
                        </div>
                        <button class="btn-add" @click="addHeadPic"><i class="fas fa-plus"></i> 添加头部图片</button>
                    </div>

                    <div class="form-group">
                        <h3><i class="fas fa-align-left"></i> 内容区块</h3>
                        <div v-for="(content, index) in config.sections[0].contents" :key="index" class="content-block">
                            <button class="remove-btn" @click="removeContent(index)">×</button>

                            <div class="content-type-selector">
                                <button class="type-btn" :class="{active: content.desc}" @click="setContentType(index, 'desc')">文本</button>
                                <button class="type-btn" :class="{active: content.pic}" @click="setContentType(index, 'pic')">图片</button>
                                <button class="type-btn" :class="{active: content.strongText}" @click="setContentType(index, 'strongText')">强调</button>
                                <button class="type-btn" :class="{active: content.video}" @click="setContentType(index, 'video')">视频</button>
                            </div>

                            <div v-if="content.desc">
                                <label>文本内容</label>
                                <textarea v-model="content.desc" rows="3"></textarea>
                                <div class="content-props">
                                    <label>高度</label>
                                    <input type="number" v-model="content.height" min="100">
                                </div>
                            </div>

                            <div v-if="content.pic">
                                <label>图片URL</label>
                                <input type="text" v-model="content.pic">
                                <div class="content-props">
                                    <label>高度</label>
                                    <input type="number" v-model="content.height" min="100">
                                </div>
                            </div>

                            <div v-if="content.strongText">
                                <label>强调文本</label>
                                <textarea v-model="content.strongText" rows="3"></textarea>
                                <div class="content-props">
                                    <label>高度</label>
                                    <input type="number" v-model="content.height" min="100">
                                </div>
                            </div>

                            <div v-if="content.video">
                                <label>视频URL</label>
                                <input type="text" v-model="content.video">
                                <label>海报URL</label>
                                <input type="text" v-model="content.poster">
                                <div class="content-props">
                                    <label>高度</label>
                                    <input type="number" v-model="content.height" min="100">
                                </div>
                            </div>
                        </div>
                        <button class="btn-add" @click="addContent"><i class="fas fa-plus"></i> 添加内容区块</button>
                    </div>

                    <div class="form-group">
                        <h3><i class="fas fa-photo-film"></i> 底部图片</h3>
                        <div v-for="(img, index) in config.sections[0].footerPic" :key="'foot'+index" class="content-block">
                            <button class="remove-btn" @click="removeFooterPic(index)">×</button>
                            <label>图片URL {{index + 1}}</label>
                            <input type="text" v-model="config.sections[0].footerPic[index]">
                        </div>
                        <button class="btn-add" @click="addFooterPic"><i class="fas fa-plus"></i> 添加底部图片</button>
                    </div>
                </div>

                <div class="preview-panel">
                    <h2>预览效果</h2>
                    
                    <div class="preview-section">
                        <h3>封面预览</h3>
                        <div class="preview-cover" v-if="config.pic">
                            <img :src="getResourcePath(config.pic)" @error="handleImageError">
                            <div v-if="imageError[getResourcePath(config.pic)]" class="image-error">
                                <i class="fas fa-image"></i> 封面图加载失败
                            </div>
                        </div>
                        <div v-else class="empty-cover">
                            <i class="fas fa-image"></i> 未设置封面图
                        </div>
                    </div>

                    <div class="preview-section" v-if="config.sections[0].headPic.length">
                        <h3>头部图片</h3>
                        <div v-for="(img, index) in config.sections[0].headPic" :key="'preview-head'+index" class="preview-image">
                            <img :src="getResourcePath(img)" @error="handleImageError">
                            <div v-if="imageError[getResourcePath(img)]" class="image-error"><i class="fas fa-image"></i> 图片加载失败</div>
                        </div>
                    </div>

                    <div class="preview-section">
                        <h3>主要内容</h3>
                        <div v-for="(content, index) in config.sections[0].contents" :key="'preview-content'+index">
                            <div v-if="content.desc" class="preview-text">
                                {{ content.desc }}
                            </div>
                            <div v-if="content.pic" class="preview-image">
                                <img :src="getResourcePath(content.pic)" @error="handleImageError">
                                <div v-if="imageError[getResourcePath(content.pic)]" class="image-error"><i class="fas fa-image"></i> 图片加载失败</div>
                            </div>
                            <div v-if="content.strongText" class="preview-strong" v-html="content.strongText">
                            </div>
                            <div v-if="content.video" class="preview-video">
                                <video controls :poster="getResourcePath(content.poster)" style="max-width: 100%;">
                                    <source :src="getResourcePath(content.video)" type="video/mp4">
                                </video>
                            </div>
                        </div>
                    </div>

                    <div class="preview-section" v-if="config.sections[0].footerPic.length">
                        <h3>底部图片</h3>
                        <div v-for="(img, index) in config.sections[0].footerPic" :key="'preview-foot'+index" class="preview-image">
                            <img :src="getResourcePath(img)" @error="handleImageError">
                            <div v-if="imageError[getResourcePath(img)]" class="image-error"><i class="fas fa-image"></i> 图片加载失败</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive } = Vue;

        createApp({
            setup() {
                const showNotification = ref(false);
                const notificationMessage = ref('');
                const notificationType = ref('success');
                const notificationIcon = ref('fas fa-check-circle');

                const showNotificationMessage = (message, type = 'success') => {
                    notificationMessage.value = message;
                    notificationType.value = type;
                    notificationIcon.value = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
                    showNotification.value = true;
                    setTimeout(() => showNotification.value = false, 3000);
                }

                const categories = {
                    "#Mint 进行时": "#FF7200",
                    "#MiNT 智造力": "#7455F6"
                };

                const defaultConfig = {
                    id: null,
                    title: "",
                    categorylabel: "#Mint 进行时",
                    time: new Date().toLocaleDateString('zh-CN'),
                    pic: "", // 封面图字段（兼容news_list.json）
                    coverPic: "", // 兼容旧字段
                    sections: [{
                        headPic: [],
                        footerPic: [],
                        contents: []
                    }]
                };

                const config = reactive(JSON.parse(JSON.stringify(defaultConfig)));
                const localNewsList = ref([]);
                const loading = ref(false);
                const imageError = reactive({});

                const getResourcePath = (relativePath) => {
                    if (!relativePath) return '';
                    
                    // 安全路径处理
                    const cleanedPath = String(relativePath)
                        .replace(/^[./\\]+/, '')
                        .replace(/^assets[\\/]/, '')
                        .replace(/\\/g, '/');
                    
                    // 判断是否为视频资源
                    const isVideo = /\.(mp4|mov|avi|webm)$/i.test(cleanedPath) || 
                                   /\/video\//i.test(cleanedPath);
                    
                    return isVideo ? `../public/${cleanedPath}` : `../src/assets/${cleanedPath}`;
                };

                const handleImageError = (e) => {
                    imageError[e.target.src] = true;
                    e.target.style.display = 'none';
                };

                const loadNewsList = async () => {
                    try {
                        loading.value = true;
                        localNewsList.value = await window.electronAPI.readNewsList();
                    } catch (error) {
                        showNotificationMessage('加载列表失败', 'error');
                    } finally {
                        loading.value = false;
                    }
                };

                const selectNews = async (news) => {
                    try {
                        loading.value = true;
                        const detail = await window.electronAPI.readNewsDetail(news.id);
                        
                        // 从news_list优先获取封面图（使用pic字段）
                        const listItem = localNewsList.value.find(item => item.id === news.id);
                        const coverPic = listItem?.pic || detail.pic || detail.coverPic;
                        
                        // 过滤空内容区块
                        const filteredContents = detail.sections?.[0]?.contents?.filter(content => {
                            return content.desc || content.pic || content.strongText || content.video;
                        }) || [];
                        
                        Object.assign(config, {
                            ...detail,
                            pic: coverPic, // 主封面图字段
                            coverPic: coverPic, // 兼容旧字段
                            sections: [{
                                headPic: detail.sections?.[0]?.headPic || [],
                                footerPic: detail.sections?.[0]?.footerPic || [],
                                contents: filteredContents
                            }]
                        });
                        
                        showNotificationMessage(`已加载新闻: ${news.title}`, 'success');
                    } catch (error) {
                        showNotificationMessage('加载详情失败', 'error');
                    } finally {
                        loading.value = false;
                    }
                };

                const createNewNews = () => {
                    const maxId = Math.max(0, ...localNewsList.value.map(n => n.id));
                    Object.assign(config, {
                        ...defaultConfig,
                        id: maxId + 1,
                        time: new Date().toLocaleDateString('zh-CN')
                    });
                };

                const saveNewsConfig = async () => {
                    try {
                        // 准备保存的数据（同步pic和coverPic字段）
                        const newsToSave = JSON.parse(JSON.stringify({
                            ...config,
                            coverPic: config.pic, // 确保coverPic字段同步
                            sections: config.sections.map(section => ({
                                ...section,
                                contents: section.contents.filter(content => 
                                    content.desc || content.pic || content.strongText || content.video
                                )
                            }))
                        }));
                        
                        // 更新新闻列表
                        const updatedList = JSON.parse(JSON.stringify(localNewsList.value));
                        const index = updatedList.findIndex(item => item.id === config.id);
                        const newsItem = {
                            ...updatedList[index] || {},
                            id: config.id,
                            title: config.title,
                            time: config.time,
                            pic: config.pic, // 同步到news_list
                            categorylabel: config.categorylabel,
                            categorycolor: categories[config.categorylabel]
                        };
                        
                        if (index === -1) {
                            updatedList.push(newsItem);
                        } else {
                            updatedList[index] = newsItem;
                        }
                        
                        const result = await window.electronAPI.saveNews(newsToSave, updatedList);
                        
                        if (result?.success) {
                            showNotificationMessage('保存成功!', 'success');
                            await loadNewsList();
                        } else {
                            throw new Error(result?.error || '保存失败');
                        }
                    } catch (error) {
                        showNotificationMessage(`保存失败: ${error.message}`, 'error');
                    }
                };
                
                const addHeadPic = () => config.sections[0].headPic.push("");
                const removeHeadPic = (index) => config.sections[0].headPic.splice(index, 1);
                const addFooterPic = () => config.sections[0].footerPic.push("");
                const removeFooterPic = (index) => config.sections[0].footerPic.splice(index, 1);
                
                const addContent = () => {
                    config.sections[0].contents.push({
                        desc: "",
                        height: 200
                    });
                };

                const removeContent = (index) => {
                    config.sections[0].contents.splice(index, 1);
                };

                const setContentType = (index, type) => {
                    const content = config.sections[0].contents[index];
                    
                    // 新内容结构（保留高度）
                    const newContent = {
                        height: content.height || 200
                    };
                    
                    if (type === 'desc') {
                        newContent.desc = content.desc || "";
                    } 
                    else if (type === 'pic') {
                        newContent.pic = content.pic || "";
                    }
                    else if (type === 'strongText') {
                        newContent.strongText = content.strongText || "";
                    }
                    else if (type === 'video') {
                        newContent.video = content.video || "";
                        newContent.poster = content.poster || "";
                    }
                    
                    config.sections[0].contents.splice(index, 1, newContent);
                };
                
                // 初始化加载
                loadNewsList();

                return {
                    showNotification,
                    notificationMessage,
                    notificationType,
                    notificationIcon,
                    config,
                    localNewsList,
                    loading,
                    imageError,
                    getResourcePath,
                    handleImageError,
                    loadNewsList,
                    selectNews,
                    createNewNews,
                    saveNewsConfig,
                    addHeadPic,
                    removeHeadPic,
                    addFooterPic,
                    removeFooterPic,
                    addContent,
                    removeContent,
                    setContentType,
                    showNotificationMessage
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
